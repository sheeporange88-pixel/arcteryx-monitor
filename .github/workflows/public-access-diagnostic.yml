name: Public access diagnostic - no secrets or notifications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-access-diagnostic.yml'
      - 'diagnose_public_access.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect bounded public HTTP responses
        run: python diagnose_public_access.py
