name: Arc'teryx Germany Telegram Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-de.yml'
      - 'monitor_de.py'
      - 'monitoring_hours.py'
      - 'notification_policy.py'
      - 'public_requests.py'
      - 'test_public_requests.py'
      - 'test_notification_policy.py'

permissions:
  contents: read

concurrency:
  group: arcteryx-germany-monitor
  cancel-in-progress: false

jobs:
  active_hours:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.clock.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check actual Berlin local time
        id: clock
        run: python3 monitoring_hours.py
  check-and-notify:
    needs: active_hours
    if: needs.active_hours.outputs.allowed == 'true'
    # Inspect every SKU each run; notify on changes or the hourly :55 check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required secret
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo 'Add TELEGRAM_BOT_TOKEN in Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Run offline correctness tests
        run: python -m unittest test_monitor_de.py test_monitoring_hours.py test_notification_policy.py test_public_requests.py
      - name: Restore baseline and delivery receipts
        uses: actions/cache/restore@v4
        with:
          path: data-de
          key: arcteryx-de-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arcteryx-de-v1-
      - name: Verify Telegram bot and resolve recipient
        run: python monitor_de.py --telegram-configure
      - name: Check German listings; notify changes or hourly unchanged results
        run: python monitor_de.py --notify
      - name: Save baseline and pending notifications
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data-de
          key: arcteryx-de-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attach product prices and run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcteryx-de-report-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            data-de/latest-report.txt
            data-de/latest-run.json
            data-de/latest-prices.csv
      - name: Publish report in workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f data-de/latest-report.txt ]; then
            cat data-de/latest-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi
